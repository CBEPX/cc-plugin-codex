name: Mutation

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "0 3 * * 0"

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    name: Pull-request mutation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:mutation:pr:force
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-pull-request
          path: reports/mutation/
          if-no-files-found: error
          retention-days: 14
          archive: true

  full:
    if: github.event_name != 'pull_request'
    name: Full mutation (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: critical
            script: test:mutation:critical:force
          - shard: render
            script: test:mutation:shard:render:force
          - shard: claude-cli
            script: test:mutation:shard:claude-cli:force
          - shard: state
            script: test:mutation:shard:state:force
          - shard: job-control
            script: test:mutation:shard:job-control:force
          - shard: managed
            script: test:mutation:shard:managed:force
          - shard: installer
            script: test:mutation:shard:installer:force
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-full-${{ matrix.shard }}
          path: reports/mutation/
          if-no-files-found: error
          retention-days: 14
          archive: true

  merge:
    needs: full
    if: ${{ always() && github.event_name != 'pull_request' }}
    name: Merge full mutation reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-full
          pattern: mutation-full-*
          separate-directories: false
          delete-merged: true
          retention-days: 14
